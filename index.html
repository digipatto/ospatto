<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Os Patto — Agenda de Shows</title>
<meta name="description" content="Agenda de shows da banda Os Patto — Reggae Rock Canastra, há 20 anos entre Araxá/MG e a Serra da Canastra.">
<style>
  :root {
    --rock: #12100e;
    --rock-2: #1c1915;
    --rock-3: #262019;
    --edge: #3a2f22;
    --verde: #1db954;
    --vermelho: #e0483a;
    --dourado: #e0a325;
    --creme: #f2ead9;
    --texto: #e8e1d3;
    --texto-2: #b7ac99;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--rock);
    color: var(--texto);
    line-height: 1.5;
    background-image:
      radial-gradient(ellipse 90% 45% at 50% -5%, rgba(29,185,84,.09), transparent 60%),
      radial-gradient(ellipse 70% 35% at 85% 12%, rgba(224,163,37,.06), transparent 60%);
    background-attachment: fixed;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 22px; }

  /* ---------- Cabeçalho ---------- */
  header { text-align: center; padding: 46px 20px 38px; }
  .banda {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 9vw, 3.9rem);
    letter-spacing: .02em;
    line-height: 1.05;
    text-transform: uppercase;
    background: linear-gradient(180deg, var(--creme) 0%, var(--dourado) 75%, #a97a17 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }
  .tagline {
    margin-top: 12px;
    color: var(--texto-2);
    font-size: clamp(.95rem, 3.4vw, 1.08rem);
    font-style: italic;
  }

  /* ---------- Topo da agenda ---------- */
  .topo {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--edge);
  }
  .topo h2 {
    font-family: Georgia, serif;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--creme);
    line-height: 1.2;
  }
  .contagem {
    margin-top: 4px;
    color: var(--texto-2);
    font-size: .78rem;
    letter-spacing: .05em;
  }
  .btn-novo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--verde), #178f42);
    color: #07130b;
    border-radius: 10px;
    padding: 11px 20px;
    text-decoration: none;
    font-size: .92rem;
    font-weight: 800;
    font-family: inherit;
    letter-spacing: .02em;
    box-shadow: 0 4px 16px rgba(29,185,84,.22);
    transition: filter .12s ease;
  }
  .btn-novo:hover { filter: brightness(1.1); }
  .btn-novo .ico { font-size: 1.05rem; line-height: 1; }

  /* ---------- Lista de shows ---------- */
  ul.lista { list-style: none; }
  ul.lista li.item {
    display: grid;
    grid-template-columns: 102px 64px 1fr auto 42px;
    grid-template-areas: "data hora nome selo edit";
    align-items: center;
    gap: 0 16px;
    padding: 18px 2px;
    border-bottom: 1px solid var(--edge);
  }
  ul.lista li.item:last-child { border-bottom: none; }

  .i-data {
    grid-area: data;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 1.08rem;
    color: var(--creme);
    white-space: nowrap;
  }
  .i-data em {
    display: block;
    margin-top: 3px;
    font-style: normal;
    font-family: "Segoe UI", sans-serif;
    font-size: .68rem;
    font-weight: 400;
    color: var(--texto-2);
    letter-spacing: .09em;
    text-transform: uppercase;
  }
  .i-hora {
    grid-area: hora;
    font-size: .92rem;
    color: var(--texto-2);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .i-hora.vazio { color: #5d564a; }
  .i-nome {
    grid-area: nome;
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--texto);
    overflow-wrap: anywhere;
  }
  .i-selo { grid-area: selo; justify-self: end; }
  .selo {
    display: inline-block;
    padding: 5px 13px;
    border-radius: 999px;
    font-size: .68rem;
    font-weight: 800;
    letter-spacing: .07em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .selo.confirmado { background: rgba(29,185,84,.16); color: var(--verde); border: 1px solid rgba(29,185,84,.55); }
  .selo.negociando { background: rgba(224,72,58,.15); color: var(--vermelho); border: 1px solid rgba(224,72,58,.55); }
  .selo.cancelado  { background: rgba(120,110,95,.12); color: #8d8371; border: 1px solid rgba(120,110,95,.4); }
  li.cancelado .i-nome, li.cancelado .i-data { opacity: .55; }
  li.cancelado .i-nome { text-decoration: line-through; }
  li.cancelado .i-hora { opacity: .55; }

  .btn-edit {
    grid-area: edit;
    justify-self: end;
    align-self: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 9px;
    color: var(--texto-2);
    font-size: 1.05rem;
    text-decoration: none;
    transition: color .12s ease, background .12s ease;
  }
  .btn-edit:hover { color: var(--dourado); background: var(--rock-3); }

  .vazio-lista {
    text-align: center;
    color: var(--texto-2);
    padding: 44px 0;
    font-style: italic;
  }
  .erro {
    margin-top: 16px;
    background: rgba(224,72,58,.12);
    border: 1px solid rgba(224,72,58,.5);
    border-radius: 10px;
    padding: 16px;
    color: #f0b3a8;
    font-size: .92rem;
  }

  /* ---------- Rodapé ---------- */
  footer {
    margin-top: 54px;
    border-top: 1px solid var(--edge);
    padding: 28px 20px 42px;
    text-align: center;
  }
  footer .serra {
    color: var(--texto-2);
    font-size: .84rem;
    font-style: italic;
    margin-bottom: 16px;
  }
  footer .redes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  footer .redes a {
    display: inline-block;
    padding: 9px 17px;
    border-radius: 9px;
    text-decoration: none;
    font-size: .88rem;
    font-weight: 600;
    color: var(--texto);
    background: var(--rock-3);
    border: 1px solid var(--edge);
    transition: border-color .12s ease;
  }
  footer .redes a:hover { border-color: var(--dourado); }
  footer .copy { margin-top: 20px; font-size: .76rem; color: #6e6556; }

  /* ---------- Mobile: duas linhas por show, bem espaçadas ---------- */
  @media (max-width: 700px) {
    .wrap { padding: 0 16px; }
    header { padding: 40px 16px 30px; }
    ul.lista li.item {
      grid-template-columns: auto 1fr auto;
      grid-template-areas:
        "data hora edit"
        "nome selo edit";
      gap: 4px 12px;
      padding: 16px 2px;
    }
    .i-data em { display: inline; margin: 0 0 0 8px; }
    .i-hora { justify-self: start; font-size: .88rem; }
    .i-nome { font-size: 1.06rem; }
    .btn-edit { width: 44px; height: 44px; }
  }
</style>
</head>
<body>

<header>
  <div class="banda">Os Patto</div>
  <p class="tagline">Reggae, rock e groove da Serra da Canastra há 20 anos</p>
</header>

<main class="wrap">
  <div class="topo">
    <div>
      <h2>Agenda</h2>
      <p class="contagem" id="contagem"></p>
    </div>
    <a class="btn-novo" id="btn-novo" href="https://t.me/Patto370Bot" target="_blank" rel="noopener">
      <span class="ico">✈️</span> Novo show
    </a>
  </div>
  <div id="agenda"><p class="vazio-lista">Carregando agenda…</p></div>
</main>

<footer>
  <p class="serra">Da Serra da Canastra pro mundo — música independente, raiz e de família.</p>
  <nav class="redes">
    <a href="https://instagram.com/ospatto" target="_blank" rel="noopener">Instagram</a>
    <a href="https://youtube.com/ospatto" target="_blank" rel="noopener">YouTube</a>
    <a href="https://facebook.com/ospattomusic" target="_blank" rel="noopener">Facebook</a>
    <a href="https://tiktok.com/@ospatto" target="_blank" rel="noopener">TikTok</a>
    <a href="https://open.spotify.com" target="_blank" rel="noopener">Spotify</a>
  </nav>
  <p class="copy">Os Patto — Reggae Rock Canastra · Araxá/MG · Desde 2006</p>
</footer>

<script>
  var BOT = "Patto370Bot";

  var ROTULO = {
    "confirmado": "Confirmado",
    "a_confirmar": "Negociando",
    "cancelado": "Cancelado"
  };

  // "Novo show" abre a conversa com o bot
  document.getElementById("btn-novo").href = "https://t.me/" + BOT + "?start=novoshow";

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function dataBR(iso) {
    if (!iso) return "";
    var p = String(iso).split("-");
    return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso;
  }
  function dowBR(iso) {
    var p = String(iso || "").split("-");
    if (p.length !== 3) return "";
    var dias = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    return isNaN(d) ? "" : dias[d.getUTCDay()];
  }
  // nome que identifica o show: o que foi colocado em "local",
  // com fallback pra cidade / endereço
  function nomeShow(s) {
    var v = [s.local, s.cidade, s.endereco];
    for (var i = 0; i < v.length; i++) {
      if (v[i] && String(v[i]).trim() !== "") return String(v[i]).trim();
    }
    return "";
  }
  // link de edição: abre o bot identificando o show
  // (parâmetro start do Telegram tem limite de 64 caracteres)
  function linkEdicao(s) {
    var slug = (String(s.data || "") + "_" + nomeShow(s))
      .toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
    var param = "editar_" + slug;
    if (param.length > 64) param = param.slice(0, 64);
    return "https://t.me/" + BOT + "?start=" + param;
  }

  fetch("shows.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status + " ao carregar shows.json");
      return r.json();
    })
    .then(function (shows) {
      var box = document.getElementById("agenda");
      if (!Array.isArray(shows) || shows.length === 0) {
        box.innerHTML = '<p class="vazio-lista">Nenhum show na agenda ainda.</p>';
        return;
      }
      shows.sort(function (a, b) {
        return String(a.data || "").localeCompare(String(b.data || ""));
      });

      document.getElementById("contagem").textContent =
        shows.length + (shows.length === 1 ? " show" : " shows");

      var html = '<ul class="lista">';
      shows.forEach(function (s) {
        var st = s.status === "confirmado" ? "confirmado"
               : s.status === "cancelado" ? "cancelado"
               : "negociando";
        var rot = ROTULO[st] || "Negociando";
        var nome = nomeShow(s);
        var hora = (s.horario && String(s.horario).trim() !== "") ? esc(s.horario) : "—";
        html +=
          '<li class="item ' + (st === "cancelado" ? "cancelado" : "") + '">' +
            '<span class="i-data">' + esc(dataBR(s.data)) +
              '<em>' + esc(dowBR(s.data)) + "</em>" +
            "</span>" +
            '<span class="i-hora' + (hora === "—" ? " vazio" : "") + '">' + hora + "</span>" +
            '<span class="i-nome">' +
              (nome ? esc(nome) : '<span style="color:#6e6556;font-style:italic;font-weight:400">a definir</span>') +
            "</span>" +
            '<span class="i-selo"><span class="selo ' + st + '">' + rot + "</span></span>" +
            '<a class="btn-edit" href="' + esc(linkEdicao(s)) + '" target="_blank" rel="noopener" title="Editar este show pelo bot" aria-label="Editar show de ' + esc(dataBR(s.data)) + '">✏️</a>' +
          "</li>";
      });
      html += "</ul>";
      box.innerHTML = html;
    })
    .catch(function (e) {
      document.getElementById("agenda").innerHTML =
        '<div class="erro">Não foi possível carregar a agenda agora. Tente recarregar a página.</div>';
      console.error(e);
    });
</script>

</body>
</html>
