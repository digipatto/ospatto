<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Os Patto — Agenda</title>
<meta name="description" content="Agenda de shows da banda Os Patto — Reggae Rock Canastra, há 20 anos entre Araxá/MG e a Serra da Canastra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: one clean column. Row = date+hora (left) · name (center) · status + edit (right).
     Essence: reggae-rock from the Serra da Canastra — warm sun gold, reggae green/gold/red mark. */
  :root{
    --bg:#f7f1e2; --fg:#1f1c12; --muted:#8a8168; --line:#e7ddc6; --tint:#efe6d1;
    --gold:#cf8a07; --gold-ink:#2a1e02;
    --green:#1f9d55; --green-bg:#e6f1e3; --green-line:#bfe0c5;
    --red:#d6431f; --red-bg:#f8e2da; --red-line:#f0c3b2;
    --reg-g:#1f9d55; --reg-y:#f0b018; --reg-r:#d6431f;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#13150d; --fg:#f1ecdc; --muted:#938e78; --line:#2a2b1f; --tint:#1a1c12;
    --gold:#edc14e; --gold-ink:#241a04;
    --green:#58c884; --green-bg:#16271b; --green-line:#2d4833;
    --red:#ef6f4a; --red-bg:#2b1a13; --red-line:#4a2d20;
    --reg-g:#58c884; --reg-y:#edc14e; --reg-r:#ef6f4a;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#13150d; --fg:#f1ecdc; --muted:#938e78; --line:#2a2b1f; --tint:#1a1c12;
    --gold:#edc14e; --gold-ink:#241a04;
    --green:#58c884; --green-bg:#16271b; --green-line:#2d4833;
    --red:#ef6f4a; --red-bg:#2b1a13; --red-line:#4a2d20;
    --reg-g:#58c884; --reg-y:#edc14e; --reg-r:#ef6f4a;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);
    font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.4}
  .wrap{max-width:580px;margin:0 auto;
    padding-left:max(20px,env(safe-area-inset-left,0px));
    padding-right:max(20px,env(safe-area-inset-right,0px));
    padding-block:30px 44px}

  header{text-align:center;margin-bottom:22px}
  .logo{font-family:"Anton",Impact,sans-serif;font-weight:400;
    font-size:clamp(44px,14vw,64px);line-height:.9;letter-spacing:.015em;text-transform:uppercase;
    margin:0;color:var(--fg)}
  .flag{width:66px;height:5px;margin:14px auto 0;border-radius:3px;overflow:hidden;display:flex}
  .flag i{flex:1}
  .flag i:nth-child(1){background:var(--reg-g)}
  .flag i:nth-child(2){background:var(--reg-y)}
  .flag i:nth-child(3){background:var(--reg-r)}
  .eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;
    color:var(--muted);margin:13px 0 0}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
  .count{font-size:12.5px;color:var(--muted);font-weight:600}
  .count b{color:var(--fg);font-weight:800}
  .novo{display:inline-flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:800;color:var(--gold-ink);
    background:var(--gold);border:none;border-radius:999px;padding:8px 14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);transition:filter .12s,transform .05s}
  .novo:hover{filter:brightness(1.06)} .novo:active{transform:translateY(1px)}
  .novo svg{width:15px;height:15px}
  :focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:8px}

  .list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:14px;padding-block:15px;border-bottom:1px solid var(--line)}

  .when{flex:none;width:94px}
  .when .dt{font-size:14.5px;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .when .hr{font-size:12px;color:var(--muted);margin-top:3px;text-transform:capitalize}
  .when .hr b{color:inherit;font-weight:inherit;font-variant-numeric:tabular-nums}

  .name{flex:1;min-width:0;font-size:16.5px;font-weight:700;color:var(--fg);line-height:1.3;word-wrap:break-word}

  .status{flex:none;display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;font-weight:800;letter-spacing:.02em;padding:5px 11px 5px 9px;
    border-radius:999px;border:1px solid;white-space:nowrap}
  .status .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .status.ok{color:var(--green);background:var(--green-bg);border-color:var(--green-line)} .status.ok .dot{background:var(--green)}
  .status.neg{color:var(--red);background:var(--red-bg);border-color:var(--red-line)} .status.neg .dot{background:var(--red)}

  .edit{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;
    color:var(--muted);text-decoration:none;border:1.5px solid var(--line);transition:color .12s,border-color .12s}
  .edit:hover{color:var(--gold);border-color:var(--gold)}
  .edit svg{width:14px;height:14px}

  .row.past{opacity:.45}

  .empty,.loading,.err{text-align:center;color:var(--muted);padding:44px 10px;font-size:14.5px}
  .err{color:var(--red)}

  footer{margin-top:30px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.02em;line-height:1.7}

  @media (max-width:390px){
    .row{gap:11px}
    .when{width:86px}
    .name{font-size:15.5px}
    .status{padding:4px 9px 4px 8px;font-size:11px}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 class="logo">OS&nbsp;PATTO</h1>
    <div class="flag" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="eyebrow">Agenda de Shows</p>
  </header>

  <div class="toolbar">
    <div class="count" id="count">&nbsp;</div>
    <a class="novo" id="novo" href="https://t.me/Patto370Bot?start=novoshow" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Novo show
    </a>
  </div>

  <div id="content"><p class="loading">Carregando…</p></div>

  <footer>Reggae Rock Canastra · Serra da Canastra · Araxá/MG</footer>
</div>

<script>
(function(){
  "use strict";
  var BOT="Patto370Bot";
  var DIAS=["dom","seg","ter","qua","qui","sex","sáb"];
  var content=document.getElementById("content");
  var countEl=document.getElementById("count");

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function parse(str){ var p=String(str||"").split("-"); if(p.length!==3) return null; var d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d)?null:d; }
  function nome(s){ var v=[s.local,s.cidade,s.endereco]; for(var i=0;i<v.length;i++){ if(v[i]&&String(v[i]).trim()) return String(v[i]).trim(); } return "A definir"; }
  function dataBR(d){ return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
  function editLink(s){
    var slug=(String(s.data||"")+"_"+nome(s)).toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
    var p="editar_"+slug; if(p.length>64) p=p.slice(0,64);
    return "https://t.me/"+BOT+"?start="+p;
  }

  function render(data){
    var tod=new Date(); tod.setHours(0,0,0,0);
    var shows=(data||[]).filter(function(s){return parse(s.data);})
      .sort(function(a,b){ return String(a.data).localeCompare(String(b.data)); });

    countEl.innerHTML=shows.length?('<b>'+shows.length+'</b> '+(shows.length===1?"show":"shows")):'&nbsp;';
    if(!shows.length){ content.innerHTML='<p class="empty">Nenhum show marcado ainda.</p>'; return; }

    var html='<ul class="list">';
    shows.forEach(function(s){
      var d=parse(s.data), ok=s.status==="confirmado", past=d<tod;
      var hora=(s.horario&&String(s.horario).trim())?'<b>'+esc(s.horario)+'</b>':'a definir';
      html+='<li class="row'+(past?" past":"")+'">'+
        '<div class="when"><div class="dt">'+dataBR(d)+'</div>'+
          '<div class="hr">'+DIAS[d.getDay()]+' · '+hora+'</div></div>'+
        '<div class="name">'+esc(nome(s))+'</div>'+
        '<div class="status '+(ok?"ok":"neg")+'"><span class="dot"></span>'+(ok?"Confirmado":"Negociando")+'</div>'+
        '<a class="edit" href="'+esc(editLink(s))+'" target="_blank" rel="noopener" aria-label="Editar pelo Telegram">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></a>'+
      '</li>';
    });
    html+='</ul>';
    content.innerHTML=html;
  }

  fetch("shows.json",{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ render(Array.isArray(d)?d:[]); })
    .catch(function(){ countEl.innerHTML='&nbsp;'; content.innerHTML='<p class="err">Não foi possível carregar a agenda. Recarregue a página.</p>'; });
})();
</script>

</body>
</html>
